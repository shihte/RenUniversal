{% extends "base.html" %}

{% block content %}
<main class="flex-1 overflow-y-auto bg-surface-bg min-h-screen">
    <!-- Header -->
    <section class="w-full bg-surface-card py-16 px-6 border-b border-border-subtle shadow-sm">
        <div class="max-w-4xl mx-auto text-center space-y-4">
            <h2 class="text-4xl font-bold text-text-main tracking-tight">應用程式庫</h2>
            <p class="text-lg text-text-muted">瀏覽並啟動目前安裝在系統上的所有互動應用程式。</p>
        </div>
    </section>

    <!-- Content Area -->
    <section class="w-full py-12 px-6">
        <div class="max-w-6xl mx-auto space-y-8">
            <!-- Toolbar -->
            <div class="flex justify-between items-center pb-4 border-b border-border-subtle">
                <h2 class="text-2xl font-semibold text-text-main tracking-tight">已安裝應用</h2>
                <button onclick="fetchApps()" class="text-primary hover:text-blue-700 text-sm font-medium flex items-center gap-2 transition-colors px-4 py-2 rounded-lg hover:bg-blue-50">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    重新整理
                </button>
            </div>

            <!-- App Grid -->
            <div id="appsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Loading State -->
                <div class="col-span-full flex flex-col items-center justify-center py-20 text-text-muted">
                    <svg class="w-10 h-10 animate-spin mb-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <p class="text-sm font-medium">正在掃描應用程式...</p>
                </div>
            </div>
        </div>
    </section>
</main>
{% endblock %}

{% block scripts %}
<script>
        async function fetchApps() {
            const grid = document.getElementById('appsGrid');
            grid.innerHTML = `
                <div class="col-span-full flex flex-col items-center justify-center py-20 text-text-muted">
                    <svg class="w-10 h-10 animate-spin mb-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <p class="text-sm font-medium">正在掃描應用程式...</p>
                </div>
            `;

            try {
                const response = await fetch('/api/apps');
                const apps = await response.json();
                
                if (apps.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full bg-surface-card p-12 text-center rounded-2xl shadow-sm border border-border-subtle space-y-4">
                            <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto text-text-muted">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                            </div>
                            <h3 class="text-xl font-semibold text-text-main">尚無安裝任何應用</h3>
                            <p class="text-sm text-text-muted max-w-md mx-auto leading-relaxed">目前 web/apps/ 目錄下沒有掃描到任何 HTML 檔案。<br>您可以透過 \`make install\` 安裝擴充套件，或手動放入 HTML 檔案。</p>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = apps.map(app => `
                    <div class="bg-surface-card rounded-2xl p-8 flex flex-col gap-6 shadow-sm border border-border-subtle hover:border-primary hover:shadow-md transition-all cursor-pointer h-full group">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center text-primary shrink-0 group-hover:bg-primary group-hover:text-white transition-colors">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </div>
                            <h3 class="text-lg font-bold text-text-main group-hover:text-primary transition-colors line-clamp-2">${app.title}</h3>
                        </div>
                        <p class="text-sm text-text-muted leading-relaxed flex-1">${app.description}</p>
                        
                        <a href="/app/${app.id}" target="_blank" class="w-full py-3 mt-4 bg-slate-50 hover:bg-primary text-text-main hover:text-white font-semibold transition-colors flex items-center justify-center gap-2 rounded-xl border border-border-subtle hover:border-primary">
                            啟動應用程式
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        </a>
                    </div>
                `).join('');
            } catch (err) {
                grid.innerHTML = `
                    <div class="col-span-full bg-red-50 p-6 rounded-2xl border border-red-100 text-center">
                        <p class="text-red-600 font-medium tracking-tight">無法獲取應用列表，請確認後端 API 是否正常運作。</p>
                        <p class="text-red-500/80 text-sm mt-2">${err.message}</p>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchApps);
    </script>
{% endblock %}
