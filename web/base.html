<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RenUniversal Agent Platform{% endblock %}</title>
    <script src="/tailwind.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'surface-bg': '#000000',
              'surface-card': '#0c0c0f',
              'primary': '#1a73e8',
              'text-main': '#ffffff',
              'text-muted': '#8f8f9e',
              'border-subtle': '#1f1f23',
            },
            fontFamily: {
              sans: ['Outfit', 'system-ui', '-apple-system', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Outfit', 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Override slate/white background classes globally to dark theme */
        .bg-white, .bg-slate-50, .bg-slate-100, .bg-slate-50-elevated {
            background-color: #0c0c0f !important;
            color: #ffffff !important;
        }
        
        .bg-slate-50-elevated {
            background-color: #121216 !important;
            border-color: #222226 !important;
        }
        
        .border, .border-slate-200, .border-slate-100, .border-border-subtle, .border-slate-700\/30, .border-b, .border-r, .border-l {
            border-color: #1f1f23 !important;
        }
        
        /* Sidebar layout background overrides */
        aside, #left-sidebar, #right-sidebar {
            background-color: #08080a !important;
            border-color: #1a1a1e !important;
        }
        
        aside *, #left-sidebar *, #right-sidebar * {
            border-color: #1a1a1e !important;
        }

        /* Typography overrides */
        .text-slate-900, .text-slate-800, .text-slate-700, .text-slate-600, .text-text-main {
            color: #ffffff !important;
        }
        
        .text-slate-500, .text-text-muted, .text-[#6e6e73], .text-slate-400 {
            color: #8f8f9e !important;
        }
        
        /* Navbar styling: Sleek glassmorphism */
        nav.bg-white {
            background-color: rgba(0, 0, 0, 0.7) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid #1a1a1e !important;
            color: #ffffff !important;
        }
        
        nav a {
            color: #9e9e9e !important;
            position: relative;
            transition: color 0.3s ease;
        }
        
        nav a:hover, nav a.text-primary {
            color: #ffffff !important;
        }
        
        nav a.text-primary::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 12px;
            right: 12px;
            height: 2px;
            background: linear-gradient(90deg, #4285F4, #34A853, #FBBC05, #EA4335);
            border-radius: 9999px;
        }
        
        /* Premium custom input fields */
        input[type="text"], input[type="number"], select, textarea {
            background-color: #121216 !important;
            border: 1px solid #2a2a32 !important;
            color: #ffffff !important;
            border-radius: 8px !important;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        
        input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
            border-color: #4285F4 !important;
            box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.15) !important;
        }

        /* Premium scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #222228; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #33333f; }
        
        /* Google I/O Gradient typography */
        .gradient-text {
            background: linear-gradient(135deg, #4285F4 0%, #34A853 30%, #FBBC05 60%, #EA4335 100%) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
        }

        /* Cards styles with hover glow effects */
        .bg-surface-card, .anthropic-card, .glass-panel, .bg-white.p-8, .bg-white.p-6, #create-skill-form, #create-event-form {
            background-color: #0c0c0f !important;
            border: 1px solid #1f1f23 !important;
            border-radius: 20px !important;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4) !important;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1) !important;
        }
        
        .bg-surface-card:hover, .anthropic-card:hover, .glass-panel:hover, .bg-white.p-8:hover, .bg-white.p-6:hover {
            border-color: #3b82f6 !important;
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.08) !important;
            transform: translateY(-2px);
        }
        
        /* Premium Buttons */
        button, .btn, a[href^="/app/"], a.card-link {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
        }
        
        button.bg-primary, input[type="submit"], button[type="submit"] {
            background: linear-gradient(90deg, #1a73e8, #1557b0) !important;
            color: #ffffff !important;
            border: none !important;
            box-shadow: 0 4px 15px rgba(26, 115, 232, 0.3) !important;
            border-radius: 9999px !important;
        }
        
        button.bg-primary:hover, input[type="submit"]:hover, button[type="submit"]:hover {
            box-shadow: 0 6px 20px rgba(26, 115, 232, 0.5) !important;
            transform: scale(1.02);
        }
        
        a[href^="/app/"], a.card-link {
            border-radius: 12px !important;
        }
        
        /* Trigger table row glow */
        tr {
            transition: background-color 0.2s ease;
        }
        tr:hover {
            background-color: rgba(255, 255, 255, 0.02) !important;
        }

        /* 溫和的範圍選擇器 */
        input[type=range] {
            width: 100%;
            height: 6px;
            background-color: #1a1a22;
            border-radius: 9999px;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background-color: #ffffff;
            border: 2px solid #1a73e8;
            -webkit-appearance: none;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            transition: transform 0.1s ease;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        {% block extra_head %}{% endblock %}
    </style>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script>
        // Ensure DOMContentLoaded fires for inline scripts after HTMX page swaps
        document.addEventListener('htmx:afterSettle', function(evt) {
            window.document.dispatchEvent(new Event("DOMContentLoaded", {
                bubbles: true,
                cancelable: true
            }));
        });
    </script>
</head>

<body hx-boost="true" class="bg-surface-bg text-text-main min-h-screen flex flex-col font-sans">
    
    <div id="camera-container" hx-preserve="true" style="display:none;"></div>
    
    <!-- 導覽列：簡化並留白 -->
    <nav class="w-full bg-white text-text-main h-16 flex items-center justify-between px-6 z-50 fixed top-0 border-b border-border-subtle shadow-sm">
        <div class="flex items-center gap-10 max-w-6xl mx-auto w-full">
            <h1 class="text-lg font-bold tracking-tight text-primary">RenUniversal</h1>
            <div class="hidden md:flex gap-6 text-sm font-medium">
                <a href="/" class="transition-colors {% if active_page == 'monitor' %}text-primary{% else %}text-text-muted hover:text-text-main{% endif %}">Monitor</a>
                <a href="/camera" class="transition-colors {% if active_page == 'camera' %}text-primary{% else %}text-text-muted hover:text-text-main{% endif %}">Camera</a>
                <a href="/skills" class="transition-colors {% if active_page == 'skills' %}text-primary{% else %}text-text-muted hover:text-text-main{% endif %}">Skills</a>
                <a href="/events" class="transition-colors {% if active_page == 'events' %}text-primary{% else %}text-text-muted hover:text-text-main{% endif %}">Events</a>
                <a href="/apps" class="transition-colors {% if active_page == 'apps' %}text-primary{% else %}text-text-muted hover:text-text-main{% endif %}">Apps</a>
            </div>
            
            <div class="ml-auto flex items-center gap-4">
                <div class="text-xs text-text-muted text-right flex flex-col leading-tight">
                    <span id="conn-status-text" class="font-medium">OFFLINE</span>
                    <span id="conn-fps-sidebar" class="opacity-80">0 FPS</span>
                </div>
                <div class="relative flex items-center justify-center w-8 h-8 rounded-full bg-slate-50 border border-slate-100">
                    <div id="conn-indicator-sidebar" class="w-2.5 h-2.5 rounded-full bg-red-500"></div>
                    <div id="conn-ping-sidebar" class="absolute w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping hidden"></div>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- 主要內容區 -->
    <div class="pt-16 flex-1 flex flex-col">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}

    <!-- Global Hidden Web Camera Capture Script -->
    <script hx-preserve="true" id="camera-capture-script">
        (function() {
            // Only run on non-mobile pages to avoid conflicts
            if (window.location.pathname === '/mobile') return;

            const container = document.getElementById('camera-container');
            if (!container || container.dataset.initialized) return;
            container.dataset.initialized = 'true';

            const video = document.createElement('video');
            video.autoplay = true;
            video.playsInline = true;
            video.muted = true;
            video.style.display = 'none';
            container.appendChild(video);

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            let localStream = null;
            let streamInterval = null;
            let isSending = false;
            let currentActiveLocal = false;

            async function startLocalCamera(deviceId) {
                if (localStream) return;
                try {
                    const constraints = { video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } } };
                    if (deviceId && deviceId !== '0') {
                        constraints.video.deviceId = { exact: deviceId };
                    }
                    localStream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = localStream;
                    streamInterval = setInterval(sendFrame, 1000 / 30);
                    console.log("Local camera started and streaming to backend.");
                } catch (e) {
                    console.error("Failed to access local camera:", e);
                }
            }

            function stopLocalCamera() {
                if (streamInterval) {
                    clearInterval(streamInterval);
                    streamInterval = null;
                }
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                    video.srcObject = null;
                    localStream = null;
                }
            }

            function sendFrame() {
                if (!video.videoWidth || isSending) return;
                
                const w = video.videoWidth;
                const h = video.videoHeight;
                if (canvas.width !== w || canvas.height !== h) {
                    canvas.width = w;
                    canvas.height = h;
                }
                
                ctx.drawImage(video, 0, 0, w, h);
                isSending = true;
                
                canvas.toBlob((blob) => {
                    if (!blob) { isSending = false; return; }
                    
                    const srcParam = currentActiveLocal ? currentActiveLocal : 'local_0';
                    fetch(`/upload_frame?source=${srcParam}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'image/jpeg' },
                        body: blob
                    }).finally(() => { isSending = false; });
                }, 'image/jpeg', 0.6);
            }

            // Poll status to check if local camera should be active
            setInterval(async () => {
                try {
                    const res = await fetch('/status');
                    const data = await res.json();
                    let sources = data.camera_source;
                    if (typeof sources === 'string') {
                        if (sources === 'dual') sources = ['local_0', 'phone'];
                        else sources = [sources];
                    }
                    if (!Array.isArray(sources)) sources = ['local_0'];
                    
                    const needsLocal = sources.find(s => s.startsWith('local_'));
                    
                    if (needsLocal && needsLocal !== currentActiveLocal) {
                        currentActiveLocal = needsLocal;
                        stopLocalCamera();
                        startLocalCamera(needsLocal.replace('local_', ''));
                    } else if (!needsLocal && currentActiveLocal) {
                        currentActiveLocal = false;
                        stopLocalCamera();
                    }
                } catch (e) {
                    // ignore network errors during polling
                }
            }, 2000);
        })();
    </script>
</body>
</html>
